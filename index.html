<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hulpmiddelen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 22px;
            text-align: center;
            background-color: #f4f6f9;
            padding: 50px 20px;
            color: #333;
        }
        h1 {
            color: #1a73e8;
            font-size: 36px;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <h1>Hulpmiddelen</h1>
    <p>Kies hieronder waar je naartoe wilt gaan:</p>

    <a href="tablet/" class="btn">📱 Tablet Hulp</a>

</body>
</html>
